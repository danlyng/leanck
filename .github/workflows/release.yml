name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools shellcheck
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo +stable build --release -p leanck-cli --locked --target ${{ matrix.target }}
      # The installer ships in every archive: test it natively, end to end through
      # install.sh and uninstall.sh (shellcheck runs where installed), before packaging.
      - name: Test the installer
        run: |
          cargo +stable test --locked -p leanck-update --lib
          cargo +stable test --locked -p xtask
          cargo +stable test --locked -p leanck-cli --test bootstrap --test install
      - name: Package release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$RELEASE_REF"
          else
            version=$(target/${{ matrix.target }}/release/leanck --version | cut -d ' ' -f 2)
          fi
          cargo +stable xtask package-release \
            --bin-dir target/${{ matrix.target }}/release \
            --output dist --target ${{ matrix.target }} --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: leanck-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    # Manual runs build downloadable CI artifacts without publishing a release.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes dist/* install.sh uninstall.sh
