[package]
name = "leanck-config"
edition.workspace = true
version = "0.1.1"

[dependencies]
anyhow = { workspace = true, optional = true }
crossterm = { version = "0.29.0", optional = true }
globset = { workspace = true, optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }
toml = { workspace = true, optional = true }
toml_edit = { version = "0.25.17", optional = true }
tui-input = { version = "0.15.5", optional = true, default-features = false, features = ["crossterm"] }
url = { workspace = true, optional = true }

[features]
default = ["loader"]
loader = ["dep:anyhow", "dep:globset", "dep:serde_json", "dep:toml", "dep:url"]
wizard = ["loader", "dep:toml_edit", "dep:tempfile", "dep:ratatui", "dep:tui-input", "dep:crossterm"]
