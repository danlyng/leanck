[package]
name = "leanck-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tui-input = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = ["loader"]
loader = ["dep:anyhow", "dep:globset", "dep:serde_json", "dep:toml", "dep:url"]
wizard = ["loader", "dep:toml_edit", "dep:tempfile", "dep:ratatui", "dep:tui-input", "dep:crossterm"]
