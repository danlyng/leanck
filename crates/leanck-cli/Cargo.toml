[package]
name = "leanck-cli"
version = "0.45.0"
edition.workspace = true

[[bin]]
name = "leanck"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
leanck-loogle.workspace = true
serde_json.workspace = true
serde.workspace = true
color-print.workspace = true
leanck-core.workspace = true
leanck-client = { version = "0.11.1", path = "../leanck-client" }
leanck-lake.workspace = true
leanck-config = { workspace = true, default-features = true, features = ["wizard"] }
leanck-mcp = { version = "0.22.0", path = "../leanck-mcp" }
leanckd = { version = "0.16.0", path = "../leanckd" }
clap_complete = "4.5.59"
leanck-normalize = { version = "0.19.0", path = "../leanck-normalize", features = ["command"] }
leanck-update = { version = "0.39.0", path = "../leanck-update" }
libc.workspace = true
comfy-table = "8.0.1"
semver = "1.0.28"

[dev-dependencies]
flate2 = "1.1.10"
libc.workspace = true
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
