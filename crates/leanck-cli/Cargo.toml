leanck-core.workspace = true
leanck-lake.workspace = true
leanck-loogle.workspace = true
leanck-mcp.workspace = true
leanck-normalize = { workspace = true, features = ["history"] }
leanck-update.workspace = true
leanckd.workspace = true
libc.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
flate2.workspace = true
