[package]
name = "leanck-cli"
version = "0.35.0"
edition.workspace = true

[[bin]]
name = "leanck"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
leanck-loogle.workspace = true
serde_json.workspace = true
serde.workspace = true
color-print.workspace = true
leanck-core.workspace = true
leanck-client = { version = "0.11.1", path = "../leanck-client" }
leanck-lake.workspace = true
leanck-config = { workspace = true, default-features = true }
leanck-mcp = { version = "0.21.0", path = "../leanck-mcp" }
leanckd = { version = "0.16.0", path = "../leanckd" }
clap_complete = "4.5.59"
leanck-normalize = { version = "0.15.0", path = "../leanck-normalize", features = ["command"] }

[dev-dependencies]
libc.workspace = true
tokio = { workspace = true, features = ["test-util"] }
