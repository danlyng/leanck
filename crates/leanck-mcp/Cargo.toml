[package]
name = "leanck-mcp"
version = "0.19.0"
edition = "2024"

[[bin]]
name = "leanck-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
leanck-client.workspace = true
leanck-config = { workspace = true, default-features = true }
leanck-core = { workspace = true, features = ["schema"] }
leanck-lake.workspace = true
leanck-loogle.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "macros", "schemars"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
