[workspace]
resolver = "3"
members = [
    "crates/leanck-cli",
    "crates/leanck-client",
    "crates/leanck-config",
    "crates/leanck-core",
    "crates/leanck-lake",
    "crates/leanck-loogle",
    "crates/leanck-mcp",
    "crates/leanck-normalize",
    "crates/leanck-update",
    "crates/leanckd",
    "xtask",
]

# Every crate is an internal part of the `leanck` binary and shares its version.
# Bump this one value for a release; wire and installer protocol versions are
# separate constants.
[workspace.package]
version = "0.51.2"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
# Workspace crates. Path-only: nothing is published, so no version requirement.
leanck-client = { path = "crates/leanck-client" }
# Defaults (the loader) are opt-in so leanck-normalize can depend on the model alone.
leanck-config = { path = "crates/leanck-config", default-features = false }
leanck-core = { path = "crates/leanck-core" }
leanck-lake = { path = "crates/leanck-lake" }
leanck-loogle = { path = "crates/leanck-loogle" }
leanck-mcp = { path = "crates/leanck-mcp" }
leanck-normalize = { path = "crates/leanck-normalize" }
leanck-update = { path = "crates/leanck-update" }
leanckd = { path = "crates/leanckd" }
xtask = { path = "xtask" }

# External crates.
anyhow = "1.0.102"
blake2 = "0.11.0"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.5.59"
color-print = "0.3.7"
comfy-table = "8.0.1"
crossterm = "0.29.0"
flate2 = "1.1.10"
futures = { version = "0.3.32", default-features = false }
globset = "0.4.20"
hex = "0.4.3"
indoc = "2.0.7"
libc = "0.2.186"
lsp-server = "0.10.0"
lsp-types = "0.95.1"
markdown = "1.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "query"] }
rmcp = "1.7.0"
schemars = "1.2.1"
self_update = { version = "1.3.1", default-features = false, features = ["reqwest", "rustls", "github", "async", "checksums"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = { version = "0.15.5", default-features = false, features = ["crossterm"] }
url = "2.5.8"
uuid = "1.23.2"
