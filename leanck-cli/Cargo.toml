[package]
name = "leanck-cli"
version = "0.25.0"
edition.workspace = true

[[bin]]
name = "leanck"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
leanck-loogle = { version = "0.4.0", path = "../leanck-loogle" }
leanck-normalize = { version = "0.14.0", path = "../leanck-normalize", features = ["command"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
color-print = "0.3.7"
leanck-core = { version = "0.10.0", path = "../leanck-core" }
leanck-client = { version = "0.11.0", path = "../leanck-client" }
leanck-lake = { version = "0.5.0", path = "../leanck-lake" }
leanck-config = { version = "0.1.0", path = "../leanck-config" }
