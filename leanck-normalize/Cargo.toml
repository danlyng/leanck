[package]
name = "leanck-normalize"
version = "0.14.0"
edition.workspace = true

[lib]
name = "leanck_normalize"
path = "src/lib.rs"

[[bin]]
name = "leanck-normalize"
path = "src/main.rs"
required-features = ["command"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
globset = { version = "0.4.20", optional = true }
leanck-config = { version = "0.1.0", path = "../leanck-config", default-features = false }
markdown = "1.0.0"
markdown-reflow = { version = "0.5.0", git = "https://github.com/danlyng/markdown-reflow.git", rev = "7da4b3abc1505533dd0bf02456ef0b7e6e712797" }
regex = "1.12.3"
serde_json.workspace = true

[dev-dependencies]
indoc = "2.0.7"

[features]
default = ["command"]
command = ["dep:clap", "dep:anyhow", "dep:globset", "leanck-config/loader"]
globset = ["dep:globset"]
