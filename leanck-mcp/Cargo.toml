[package]
name = "leanck-mcp"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "leanck-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
leanck-loogle = { version = "0.1.0", path = "../leanck-loogle" }
leanckd = { version = "0.2.0", path = "../leanckd" }
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
