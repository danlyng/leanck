[package]
name = "leanck-mcp"
version = "0.19.0"
edition = "2024"

[[bin]]
name = "leanck-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
leanck-client = { version = "0.11.0", path = "../leanck-client" }
leanck-config = { version = "0.1.0", path = "../leanck-config" }
leanck-core = { version = "0.10.0", path = "../leanck-core", features = ["schema"] }
leanck-lake = { version = "0.5.0", path = "../leanck-lake" }
leanck-loogle = { version = "0.4.0", path = "../leanck-loogle" }
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
